name: Deploy AISAM

on:
  push:
    branches:
      - main
      - master
    paths:
      - "AISAM-BE/**"
      - "AISAM-FE/**"
      - "deploy-aisam.sh"
      - ".github/workflows/deploy-aisam.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/AISAM
            # next-env.d.ts is generated by Next.js and older revisions tracked
            # it. A production build changes its route-types import, which used
            # to leave the VPS worktree dirty and make the next git pull abort.
            git restore --worktree AISAM-FE/next-env.d.ts 2>/dev/null || true
            chmod +x deploy-aisam.sh
            ./deploy-aisam.sh
