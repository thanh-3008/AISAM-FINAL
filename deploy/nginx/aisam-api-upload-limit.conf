# Include this file inside the `server` block that serves api.aisam.io.vn.
#
# The application accepts media files up to 50 MiB. The extra 5 MiB allows for
# multipart/form-data boundaries and headers while retaining a bounded request
# size at the reverse proxy. ASP.NET Core independently enforces the same
# transport allowance only on POST /api/content/media and validates the actual
# file payload at 50 MiB.
client_max_body_size 55M;
